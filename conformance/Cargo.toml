[package]
name = "conformance"
version = "0.0.0"
publish = false
description = "Reference oracles and gates for halflight: the checkerboard measurement as a test, differential parity against image and fast_image_resize, and the isolated-process benchmark matrix. Never published."
edition.workspace = true
license.workspace = true

# The incumbents are ordinary dependencies rather than dev-dependencies because
# the bench binary needs them, and a bin cannot see dev-deps. This package is
# never published, so the weight lands nowhere.
[dependencies]
halflight = { path = "../crates/halflight" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Default features on purpose: `default-features = false` selects fir's no_std
# shim, whose x86 runtime SIMD dispatch then references `cpufeatures` without
# depending on it, and the build dies on x86_64 (first CI run, 2026-09-02). On an
# arm64 workstation those cfgs are dead code, which is how it compiled locally.
fast_image_resize = "6.1"

[[bin]]
name = "conformance"
path = "src/main.rs"
