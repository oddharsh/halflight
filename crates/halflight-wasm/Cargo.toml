[package]
name = "halflight-wasm"
version = "0.1.0"
publish = false
description = "wasm-bindgen surface for the halflight npm package. The crate is the product; this is its door into JavaScript."
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
halflight = { path = "../halflight" }
wasm-bindgen = "0.2"

